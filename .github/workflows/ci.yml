name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build app
        run: ./build.sh --universal
      - name: Verify universal app signature
        run: |
          lipo .build/LeanBar.app/Contents/MacOS/LeanBar -verify_arch arm64 x86_64
          codesign --verify --deep --strict .build/LeanBar.app
      - name: Run noninteractive tests
        run: python3 tests/check.py
